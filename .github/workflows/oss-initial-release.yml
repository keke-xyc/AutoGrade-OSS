name: OSS v0.1.0 bootstrap
on:
  workflow_run:
    workflows: ["OSS regression"]
    types: [completed]
permissions:
  contents: write
jobs:
  publish-initial-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish v0.1.0 only once after passing full OSS CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v0.1.0 release already exists"
            exit 0
          fi
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "AutoGrade v0.1.0" \
            --notes-file docs/RELEASE_NOTES.md
